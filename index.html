<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 导航栏 -->
  <header class="navbar">
    <div class="logo">MySite</div>
    <nav>
      <a href="#about">关于我</a>
      <a href="#projects">项目经历</a>
      <a href="#contact">联系方式</a>
      <button id="theme-toggle" class="theme-btn" title="切换深色/浅色模式">🌙</button>
    </nav>
  </header>

  <!-- 主体介绍 -->
  <main class="container">
    <section id="about" class="hero-section">
      <div class="avatar">👨‍💻</div>
      <h1 id="greeting">你好，欢迎来到我的个人主页！</h1>
      <p class="bio">一名热爱技术、喜欢探索新事物的开发者。在这里记录我的经历与创作。</p>
      <button id="say-hi-btn" class="action-btn">打个招呼 👋</button>
    </section>

    <!-- 项目展示 -->
    <section id="projects" class="section">
      <h2>精选项目</h2>
      <div class="grid">
        <div class="card">
          <h3>🚀 项目一</h3>
          <p>这是我的第一个项目简介，可以在这里展示你做过的作品或想法。</p>
        </div>
        <div class="card">
          <h3>🎨 项目二</h3>
          <p>这是我的第二个项目简介，用简洁优雅的文字阐述它的核心亮点。</p>
        </div>
        <div class="card">
          <h3>📱 项目三</h3>
          <p>响应式设计、移动端适配良好的交互展示。</p>
        </div>
      </div>
    </section>

    <!-- 联系方式 -->
    <section id="contact" class="section">
      <h2>联系我</h2>
      <p>如果你对我感兴趣或者有任何合作想法，欢迎随时联系我：</p>
      <div class="contact-links">
        <a href="mailto:example@email.com" class="contact-item">📧 邮箱: example@email.com</a>
        <a href="https://github.com" target="_blank" rel="noopener" class="contact-item">🐙 GitHub</a>
      </div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer>
    <p>© <span id="year"></span> 个人主页 · 保留所有权利</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
